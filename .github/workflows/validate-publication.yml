name: Validate publication metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate resolved Zenodo links and manifest
        run: python3 validate_repository.py --root .

      - name: Test portable preflight and download diagnostics
        run: python3 -m unittest discover -s tests -v
